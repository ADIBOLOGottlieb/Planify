# /etc/nginx/sites-available/planify — API et interface d'administration
# Certificats : sudo certbot --nginx -d api.planify.tg -d admin.planify.tg

server {
    listen 80;
    server_name api.planify.tg admin.planify.tg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.planify.tg admin.planify.tg;

    ssl_certificate     /etc/letsencrypt/live/api.planify.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.planify.tg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/planify-api/public;
    index index.php;
    client_max_body_size 6M; # photos de reçus (5 Mo max côté Laravel)

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
